# Al subir un tag vX.Y.Z, GitHub compila Lienzo para Windows y publica la Release.
# Las apps instaladas la detectan solas y muestran "NEW UPDATE AVAILABLE".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Compila el instalador (Lienzo-Setup-X.exe + .blockmap + latest.yml)
      - run: npx electron-builder --win --publish never

      # Sube los archivos a la Release del tag. Borra antes cualquier Release vieja
      # de ese tag (también borradores a medias) sin tocar el tag de git.
      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          case "$tag" in v*) ;; *) echo "Lanza el workflow desde un tag vX.Y.Z, no desde '$tag'"; exit 1 ;; esac

          ls -la dist
          files=(dist/Lienzo-Setup-*.exe dist/Lienzo-Setup-*.exe.blockmap dist/latest.yml)
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "Falta $f"; exit 1; }; done

          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id")
          for id in $ids; do
            echo "Borrando release anterior $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

          gh release create "$tag" "${files[@]}" --title "$tag" --notes-file build/release-notes.md --verify-tag --latest
