# Al subir un tag vX.Y.Z, GitHub compila Lienzo para Windows y publica la Release.
# Las apps instaladas la detectan solas y muestran "NEW UPDATE AVAILABLE".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
